<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGPU + Bayer</title>
<style>
  /* Tokens do "projeto": o código lê só estas variáveis. Troque pelos tokens reais do seu tema. */
  :root { color-scheme: light dark; --c0:#eef0fb; --c1:#a9b7f0; --c2:#5a72d4; --c3:#1b2766; --page:#f7f7fb; --ink:#14172b; }
  @media (prefers-color-scheme: dark) { :root { --c0:#090a13; --c1:#1f2c78; --c2:#5f79e8; --c3:#f1ecd9; --page:#0c0d16; --ink:#e9ebf8; } }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 640px; max-width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; }
  #fallback { padding: 16px; max-width: 640px; }
</style>
</head>
<body>
<canvas id="c" width="160" height="90" aria-label="Campo de ondas em dither Bayer" role="img"></canvas>
<p id="fallback" hidden>WebGPU indisponível neste navegador. Use o snippet webgl2-puro.html (mesmo efeito, suporte de 97% dos usuários).</p>
<script type="module">
// WebGPU puro (WGSL). Mesmo efeito dos outros snippets: 4 tons (tokens) + Bayer 8x8. Canvas de 1 pixel por célula.
// WebGPU só existe em contexto seguro (https ou localhost). Sempre tenha um plano B (WebGL2): o suporte ainda varia por plataforma.
const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
const token = (name) => {                      // '--c0' -> [r, g, b, 1] em 0..1
  const el = document.body.appendChild(document.createElement('i'));
  el.style.color = `var(${name})`;
  probe.canvas.width = probe.canvas.height = 1;
  probe.fillStyle = '#000'; probe.fillStyle = getComputedStyle(el).color; probe.fillRect(0, 0, 1, 1);
  el.remove();
  return [...probe.getImageData(0, 0, 1, 1).data.slice(0, 3)].map((v) => v / 255).concat(1);
};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas = document.getElementById('c');
const adapter = await navigator.gpu?.requestAdapter();
if (!adapter) {
  canvas.hidden = true; document.getElementById('fallback').hidden = false;
  window.__fallback = true; window.__ready = true;
} else {
  const device = await adapter.requestDevice();
  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });

  const module = device.createShaderModule({ code: /* wgsl */`
struct U { res: vec2f, time: f32, pad: f32, c0: vec4f, c1: vec4f, c2: vec4f, c3: vec4f };
@group(0) @binding(0) var<uniform> u: U;

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));   // um triângulo cobre a tela
  return vec4f(p[i], 0.0, 1.0);
}

fn bayer8(c: vec2u) -> f32 {                  // forma fechada por bits (scripts/bayer.mjs): limiar em (0,1)
  var v = 0u;
  for (var b = 0u; b < 3u; b = b + 1u) {
    let bit = 2u - b;
    let xb = (c.x >> bit) & 1u;
    let yb = (c.y >> bit) & 1u;
    v = v + ((2u * xb + 3u * yb - 4u * xb * yb) << (2u * b));
  }
  return (f32(v) + 0.5) / 64.0;
}

@fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
  let uv = pos.xy / u.res;                    // WebGPU: origem no canto SUPERIOR esquerdo (o GLSL é no inferior)
  let f = 0.5 + 0.25 * sin(uv.x * 7.0 + u.time * 0.55) + 0.25 * sin(uv.y * 9.0 - u.time * 0.45 + uv.x * 3.0);
  let q = clamp(floor(f * 3.0 + bayer8(vec2u(pos.xy))), 0.0, 3.0);
  if (q < 0.5) { return u.c0; }
  if (q < 1.5) { return u.c1; }
  if (q < 2.5) { return u.c2; }
  return u.c3;
}` });

  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list' },
  });
  const ubo = device.createBuffer({ size: 80, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubo } }] });
  const data = new Float32Array(20);
  data.set([canvas.width, canvas.height, 2, 0], 0);
  [0, 1, 2, 3].forEach((i) => data.set(token(`--c${i}`), 4 + 4 * i));
  const draw = (t) => {
    data[2] = t;
    device.queue.writeBuffer(ubo, 0, data);
    const enc = device.createCommandEncoder();
    const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.draw(3); pass.end();
    device.queue.submit([enc.finish()]);
  };
  draw(2);
  if (!reduced) requestAnimationFrame(function loop(ms) { if (!document.hidden) draw(ms / 1000); requestAnimationFrame(loop); });
  window.__ready = true;
}
</script>
</body>
</html>
