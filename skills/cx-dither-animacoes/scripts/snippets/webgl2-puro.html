<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL2 puro + Bayer</title>
<style>
  /* Tokens do "projeto": o código lê só estas variáveis. Troque pelos tokens reais do seu tema. */
  :root { color-scheme: light dark; --c0:#eef0fb; --c1:#a9b7f0; --c2:#5a72d4; --c3:#1b2766; --page:#f7f7fb; }
  @media (prefers-color-scheme: dark) { :root { --c0:#090a13; --c1:#1f2c78; --c2:#5f79e8; --c3:#f1ecd9; --page:#0c0d16; } }
  html, body { margin: 0; background: var(--page); }
  canvas, svg { display: block; }
  canvas { width: 640px; max-width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="160" height="90" aria-label="Campo de ondas em dither Bayer" role="img"></canvas>
<script type="module">
// WebGL2 sem biblioteca: um triângulo que cobre a tela + fragment shader. Canvas de 1 pixel por célula.
const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
const token = (name) => {                      // '--c0' -> [r, g, b] em 0..1
  const el = document.body.appendChild(document.createElement('i'));
  el.style.color = `var(${name})`;
  probe.canvas.width = probe.canvas.height = 1;
  probe.fillStyle = '#000'; probe.fillStyle = getComputedStyle(el).color; probe.fillRect(0, 0, 1, 1);
  el.remove();
  return [...probe.getImageData(0, 0, 1, 1).data.slice(0, 3)].map((v) => v / 255);
};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;   // quadro parado se a pessoa pediu menos movimento
const c = document.getElementById('c'), gl = c.getContext('webgl2', { antialias: false });
const fs = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec3 uC0, uC1, uC2, uC3;
float bayer8(vec2 c) {                           // Bayer 8x8 procedural (scripts/bayer.mjs --format glsl)
  vec2 q = mod(floor(c), 8.0); float v = 0.0;
  { float x = floor(q.x / 4.0), y = floor(q.y / 4.0); v += (2.0*x + 3.0*y - 4.0*x*y); }
  { float x = mod(floor(q.x / 2.0), 2.0), y = mod(floor(q.y / 2.0), 2.0); v += (2.0*x + 3.0*y - 4.0*x*y) * 4.0; }
  { float x = mod(q.x, 2.0), y = mod(q.y, 2.0); v += (2.0*x + 3.0*y - 4.0*x*y) * 16.0; }
  return (v + 0.5) / 64.0;
}
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;               // o canvas já tem 1 pixel por célula
  float f = 0.5 + 0.25*sin(uv.x*7.0 + uTime*0.55) + 0.25*sin(uv.y*9.0 - uTime*0.45 + uv.x*3.0);
  float q = clamp(floor(f * 3.0 + bayer8(gl_FragCoord.xy)), 0.0, 3.0);
  o = vec4(q < 0.5 ? uC0 : q < 1.5 ? uC1 : q < 2.5 ? uC2 : uC3, 1.0);
}`;
const vs = '#version 300 es\nin vec2 p; void main() { gl_Position = vec4(p, 0., 1.); }';
const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(o)); return o; };
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const u = (n) => gl.getUniformLocation(pr, n);
[0, 1, 2, 3].forEach((i) => gl.uniform3fv(u('uC' + i), token('--c' + i)));
gl.uniform2f(u('uRes'), c.width, c.height);
const draw = (t) => { gl.uniform1f(u('uTime'), t); gl.drawArrays(gl.TRIANGLES, 0, 3); };
draw(2);
if (!reduced) (function loop(ms) { if (!document.hidden) draw(ms / 1000); requestAnimationFrame(loop); })(0);
window.__ready = true;
</script>
</body>
</html>
