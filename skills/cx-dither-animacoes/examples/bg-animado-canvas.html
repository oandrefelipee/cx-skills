<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fundo animado em dither (canvas 2D)</title>
<!--
  DEMONSTRA: fundo Bayer 8x8 animado (12 fps, 3 tons), sombra de contato pontilhada e confete de
  quadradinhos. Sem WebGL; pausa com aba oculta/fora da tela; respeita prefers-reduced-motion.
  USA: ../scripts/js/dither-canvas.js  (createDitherBackground, ditherShadow, confetti)
-->
<style>
  :root { --bg:#1235E6; --ink:#F5F7FF; --accent:#FFE24A; --navy:#0A1A7A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--navy); color: var(--ink); font: 400 16px/1.5 system-ui, sans-serif; overflow-x: hidden; }
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  canvas.layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .fx { pointer-events: none; z-index: 3; }
  .card { position: relative; z-index: 2; width: min(92vw, 420px); background: var(--bg); border: 0; padding: 28px 24px 24px; text-align: center; box-shadow: 0 6px 0 var(--navy); }
  h1 { font: 800 28px/1.1 system-ui, sans-serif; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #C3CCFF; font-size: 15px; }
  .coin { position: relative; width: 160px; height: 150px; margin: 0 auto 14px; }
  .coin canvas { position: absolute; left: 0; bottom: 0; width: 160px; height: 36px; image-rendering: pixelated; }
  .coin img { position: absolute; left: 0; top: 0; width: 160px; height: 160px; object-fit: contain; }
  button { min-height: 48px; padding: 0 24px; border: 0; background: var(--accent); color: var(--navy); font: 800 16px system-ui, sans-serif; cursor: pointer; box-shadow: 0 4px 0 #B8932A; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #B8932A; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px #5B78FF; }
</style>
</head>
<body>
<div class="stage">
  <canvas class="layer" id="bg" aria-hidden="true"></canvas>
  <canvas class="layer fx" id="fx" aria-hidden="true"></canvas>
  <main class="card">
    <div class="coin"><canvas id="shadow" width="40" height="9" aria-hidden="true"></canvas><img src="../assets/sticker-moedas.png" alt="moedas"></div>
    <h1>Dither é tempero</h1>
    <p>Fundo, sombra e confete em dither; o resto fica limpo.</p>
    <div class="row">
      <button id="go" data-primary>Comemorar</button>
      <button class="ghost" id="pause">Pausar fundo</button>
    </div>
  </main>
</div>

<script type="module">
import { createDitherBackground, ditherShadow, confetti } from '../scripts/js/dither-canvas.js';

const bg = createDitherBackground(document.getElementById('bg'), {
  colors: ['#0A1A7A', '#1235E6', '#2E5BFF'], cell: 4, fps: 12, speed: 1,
});

// sombra de contato: canvas pequeno (1 px do canvas = 4 px na tela) esticado com pixelated
const sc = document.getElementById('shadow');
ditherShadow(sc.getContext('2d'), 3, 1, 34, 7, { color: '#0A1A7A', cell: 1, density: 1 });

// confete: o buffer do canvas fica em metade da tela (cada particula = 3 px do canvas)
const fxc = document.getElementById('fx');
const fit = () => { fxc.width = Math.round(innerWidth / 2); fxc.height = Math.round(innerHeight / 2); };
fit(); addEventListener('resize', fit);
const fx = confetti(fxc, { colors: ['#FFE24A', '#7BE8FF', '#FFFFFF'], size: 3 });

document.getElementById('go').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  fx.burst((r.left + r.width / 2) / 2, (r.top) / 2, 30);
  fx.rain(30);
});
let on = true;
const pb = document.getElementById('pause');
pb.addEventListener('click', () => { on = !on; on ? bg.start() : bg.stop(); pb.textContent = on ? 'Pausar fundo' : 'Retomar fundo'; });
setTimeout(() => fx.burst(innerWidth / 4, innerHeight / 4, 24), 800); // dispara sozinho p/ o print
</script>
</body>
</html>
