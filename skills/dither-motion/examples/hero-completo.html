<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero completo em dither</title>
<!--
  DEMONSTRA: UMA página que combina tudo com moderação ("dither é tempero"):
    - fundo Canvas 2D em dither Bayer 8x8 só no cabeçalho (respira devagar, pausa fora de vista);
    - painel CHAPADO com título limpo (sem dither sob o texto);
    - botão com relevo 3D (sombra dura que afunda ao apertar);
    - objeto (adesivo) com sombra de contato pontilhada e entrada em dissolve Bayer (WebGL, modo 'passthrough');
    - rabisco desenhando sob a palavra "recarga" (máscara + clip-path, em passos) e marcador pontilhado
      (padrão xadrez 2 px em CSS) sob a frase de apoio.
  Mobile (360x640 em diante) e desktop; passa em scripts/verify/check-layout.cjs --primary '[data-primary]'.
  USA: ../scripts/js/dither-canvas.js (createDitherBackground, ditherShadow), ../scripts/js/dither-gl.js (DitherGL, loadImage),
       ../scripts/js/doodle-mask.js (drawDoodle), ../scripts/js/motion-helpers.js (spring).
  Sem WebGL: o objeto aparece como <img> normal. prefers-reduced-motion: fundo estático, sem entrada nem flutuação.
-->
<style>
  :root { --bg:#1235E6; --navy:#0A1A7A; --ink:#F5F7FF; --muted:#C3CCFF; --accent:#FFE24A; --accent-d:#B8932A; --cyan:#7BE8FF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--navy); color: var(--ink); font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .hero { position: relative; min-height: 100svh; display: grid; place-items: center; padding: 20px 16px 28px; overflow: hidden; }
  canvas.bgc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .inner { position: relative; z-index: 1; width: min(100%, 940px); display: grid; gap: 14px; justify-items: center; align-items: center; }
  @media (min-width: 820px) { .inner { grid-template-columns: 1.25fr 1fr; gap: 40px; } .inner .obj { order: 2; } }

  /* objeto + sombra pontilhada */
  .obj { position: relative; width: clamp(120px, 40vw, 340px); aspect-ratio: 1; }
  .obj .shadow { position: absolute; left: 12%; width: 76%; bottom: 4%; height: 12%; image-rendering: pixelated; }
  .obj .art { position: absolute; inset: 0; animation: bob 3.2s steps(6, end) infinite; }
  .obj canvas, .obj img { width: 100%; height: 100%; display: block; }
  @keyframes bob { 50% { transform: translateY(-6px); } }

  /* painel chapado: sem moldura fina, relevo por sombra dura */
  .panel { background: var(--bg); padding: 24px 22px 22px; box-shadow: 0 6px 0 var(--navy); width: 100%; display: grid; gap: 12px; }
  .eyebrow { margin: 0; font: 700 12px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); }
  h1 { margin: 0; font: 800 clamp(26px, 6.4vw, 44px)/1.08 system-ui, sans-serif; letter-spacing: -.01em; }
  .hl { position: relative; display: inline-block; white-space: nowrap; }
  .hl i { position: absolute; left: -4px; right: -4px; bottom: -10px; height: 16px; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 16px; }
  /* marcador pontilhado: xadrez 2 px (aprox. Bayer 50%) numa faixa de 4 px sob o texto */
  mark.dots { color: var(--ink); background: repeating-conic-gradient(var(--accent) 0 25%, transparent 0 50%) 0 100% / 4px 4px repeat-x; padding-bottom: 5px; }
  .btn { min-height: 52px; padding: 0 26px; border: 0; background: var(--accent); color: var(--navy); font: 800 17px system-ui, sans-serif; cursor: pointer; box-shadow: 0 5px 0 var(--accent-d); justify-self: start; }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-d); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .trust { margin: 0; font-size: 13px; color: var(--muted); }
  @media (max-width: 819px) { .btn { justify-self: stretch; } }
  @media (prefers-reduced-motion: reduce) { .obj .art { animation: none; } }
</style>
</head>
<body>
<header class="hero">
  <canvas class="bgc" id="bg" aria-hidden="true"></canvas>
  <div class="inner">
    <div class="obj" aria-hidden="true">
      <canvas class="shadow" id="shadow" width="38" height="8"></canvas>
      <div class="art" id="art"></div>
    </div>
    <section class="panel">
      <p class="eyebrow">Primeiros passos</p>
      <h1>Seu espaço está pronto. Falta o primeiro <span class="hl">passo<i id="ul" aria-hidden="true"></i></span>.</h1>
      <p class="sub">Com ela, a plataforma começa a <mark class="dots">trabalhar por você</mark>.</p>
      <button class="btn" data-primary type="button">Ver pacotes</button>
      <p class="trust">O primeiro passo traz um bônus de boas-vindas.</p>
    </section>
  </div>
</header>

<script type="module">
import { createDitherBackground, ditherShadow } from '../scripts/js/dither-canvas.js';
import { DitherGL, loadImage } from '../scripts/js/dither-gl.js';
import { drawDoodle } from '../scripts/js/doodle-mask.js';
import { spring } from '../scripts/js/motion-helpers.js';
window.DITHER_MOTION_CDN = false; // exemplo autonomo; remova para usar a lib Motion (CDN)

// 1) fundo dither do cabeçalho (3 tons, 12 fps, 4 px por célula)
createDitherBackground(document.getElementById('bg'), { colors: ['#0A1A7A', '#1235E6', '#2E5BFF'], cell: 4, fps: 12, speed: 0.8 });

// 2) sombra de contato pontilhada (canvas minúsculo, ampliado com pixelated)
ditherShadow(document.getElementById('shadow').getContext('2d'), 2, 1, 34, 6, { color: '#0A1A7A', cell: 1, density: 1 });

// 3) objeto: WebGL passthrough com dissolve Bayer na entrada (fallback: <img>)
const art = document.getElementById('art');
const img = await loadImage('../assets/sticker-moedas.png');
if (DitherGL.supported()) {
  const cv = document.createElement('canvas');
  art.append(cv);
  const gl = new DitherGL(cv);
  const fit = () => { gl.resize(art.clientWidth, art.clientHeight); gl.draw({ mode: 'passthrough', reveal: 1 }); };
  gl.setTexture(img, { premult: true });
  fit(); addEventListener('resize', fit);
  gl.resize(art.clientWidth, art.clientHeight); gl.draw({ mode: 'passthrough', reveal: 0 });
  spring(v => gl.draw({ mode: 'passthrough', reveal: v, px: 4 }), { duration: 0.9, bounce: 0.1, delay: 0.25, steps: 12 });
} else { art.append(img); }

// 4) rabisco desenhando sob "recarga" (em passos, estilo pixel), depois da entrada
drawDoodle(document.getElementById('ul'), { src: '../assets/doodles/sublinhado-onda-pixel.svg', color: '#FFE24A', steps: 8, duration: 800, delay: 900 });
</script>
</body>
</html>
